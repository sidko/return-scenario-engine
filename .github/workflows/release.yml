name: Publish paired artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed-off tag in the form v<version>.
        required: true
        type: string
      target:
        description: Registry side to publish or retry.
        required: true
        default: both
        type: choice
        options: [both, npm, pypi]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          test "${{ inputs.release_tag }}" = "v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").version')" = "$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip install build
          npm ci
          PYTHON_BIN=python npm test
          python -m build python
  npm:
    needs: verify
    if: inputs.target == 'both' || inputs.target == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - run: npm publish --access public --provenance
  pypi:
    needs: verify
    if: inputs.target == 'both' || inputs.target == 'pypi'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
