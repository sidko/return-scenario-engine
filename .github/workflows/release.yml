name: Publish paired artifacts

on:
  push:
    tags: ["v*", "retry/v*"]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      artifact_sha: ${{ steps.release.outputs.artifact_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - id: release
        run: |
          if [[ "$GITHUB_REF_NAME" == retry/v*/* ]]; then tag="${GITHUB_REF_NAME#retry/}"; tag="${tag%/*}"; else tag="$GITHUB_REF_NAME"; fi
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$(git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.artifact_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22.22.2, cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").version')" = "$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip install build setuptools
          npm ci
          PYTHON_BIN=python npm test
  npm:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    environment: npm
    permissions: {contents: read, id-token: write}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.artifact_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: |
          npm install --prefix "$RUNNER_TEMP/npm11" npm@11.19.1
          echo "PUBLISH_NPM=$RUNNER_TEMP/npm11/node_modules/.bin/npm" >> "$GITHUB_ENV"
          npm ci && npm run build
      - run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"; version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          "$PUBLISH_NPM" pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          file="$(node -p 'require(process.env.RUNNER_TEMP + "/pack.json")[0].filename')"; local="$(shasum -a 1 "$RUNNER_TEMP/$file" | awk '{print $1}')"
          remote="$(npm view "$name@$version" dist.shasum 2>/dev/null || true)"
          if test -z "$remote"; then
            if [[ "$version" == *-* ]]; then "$PUBLISH_NPM" publish "$RUNNER_TEMP/$file" --access public --provenance --tag next
            else "$PUBLISH_NPM" publish "$RUNNER_TEMP/$file" --access public --provenance; fi
          elif test "$remote" = "$local"; then echo "npm already has these exact package bytes"
          else echo "npm content mismatch" >&2; exit 1; fi
  pypi:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: {contents: read, id-token: write}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - run: cp tools/pypi_release_state.py "$RUNNER_TEMP/pypi_release_state.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.artifact_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install build setuptools
      - run: |
          test "$RELEASE_TAG" = "v$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m build python
      - id: existing
        env:
          DIST_DIR: python/dist
          PYPI_PACKAGE: return-scenario-engine
          PYPI_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: python "$RUNNER_TEMP/pypi_release_state.py"
      - if: steps.existing.outputs.state == 'publish'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: {packages-dir: python/dist/, skip-existing: true}
      - env:
          DIST_DIR: python/dist
          MODE: post
          PYPI_PACKAGE: return-scenario-engine
          PYPI_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: python "$RUNNER_TEMP/pypi_release_state.py"
  release:
    needs: [resolve, npm, pypi]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          if [[ "$RELEASE_TAG" == *-* ]]; then gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          else gh release create "$RELEASE_TAG" --verify-tag --generate-notes; fi
