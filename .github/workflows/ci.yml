name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build setuptools
      - run: npm ci
      - run: PYTHON_BIN=python npm test
      - run: |
          PYTHONPATH=python python tools/check_methodology.py
          PYTHONPATH=python python tools/generate_golden.py --check
      - run: python -m build python
