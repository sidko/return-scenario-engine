[project]
name = "return-scenario-engine"
version = "0.1.0"
requires-python = ">=3.11"
description = "Portable historical return scenario calculations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Sid Kalla"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]

[project.urls]
Homepage = "https://github.com/sidko/return-scenario-engine"
Repository = "https://github.com/sidko/return-scenario-engine"
Issues = "https://github.com/sidko/return-scenario-engine/issues"

[project.optional-dependencies]
test = ["build>=1.2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["return_scenario_engine", "return_scenario_engine.methodology"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
return_scenario_engine = ["methodology/*.json"]
